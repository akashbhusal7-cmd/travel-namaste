<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Namaste - Premium Boutique Travel Agency</title>
    
    <!-- Google Fonts for Luxury Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Modern CSS Architecture using Premium Color Palette */
        :root {
            --navy: #0A192F;
            --cream: #F4F1EA;
            --gold: #C5A880;
            --gold-hover: #E2C9A1;
            --white: #FFFFFF;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Jost', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--cream);
            color: var(--navy);
            overflow-x: hidden;
        }

        /* Premium Sticky Navigation Bar with Frosted Glass Effect */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(197, 168, 128, 0.2);
            transition: all 0.4s ease;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--gold);
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--cream);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-cta {
            background: transparent;
            color: var(--gold) !important;
            border: 1px solid var(--gold);
            padding: 0.6rem 1.5rem;
            border-radius: 0;
            transition: all 0.3s ease !important;
        }

        .nav-cta:hover {
            background: var(--gold);
            color: var(--navy) !important;
        }

        /* Fullscreen Hero Interactive Slider Section */
        #home {
            height: 100vh;
            position: relative;
            overflow: hidden;
            background-color: var(--navy);
        }

        .hero-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease-in-out, visibility 1.2s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .hero-slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* High-quality placeholder image strings to avoid asset loading breaks */
        .slide-1 {
            background-image: linear-gradient(rgba(10, 25, 47, 0.5), rgba(10, 25, 47, 0.5)), url('https://images.unsplash.com/photo-1544735716-392fe2489ffa?auto=format&fit=crop&w=1920&q=80');
        }

        .slide-2 {
            background-image: linear-gradient(rgba(10, 25, 47, 0.5), rgba(10, 25, 47, 0.5)), url('https://images.unsplash.com/photo-1486915309851-b0cc1f8a0084?auto=format&fit=crop&w=1920&q=80');
        }

        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--white);
            z-index: 10;
            width: 90%;
            max-width: 800px;
        }

        .hero-content h1 {
            font-family: var(--font-serif);
            font-size: 4.5rem;
            font-weight: 400;
            letter-spacing: 3px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 2.5rem;
            color: var(--cream);
            text-transform: uppercase;
        }

        .hero-btn {
            display: inline-block;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--navy);
            background-color: var(--gold);
            padding: 1rem 2.5rem;
            border: 1px solid var(--gold);
            transition: all 0.3s ease;
        }

        .hero-btn:hover {
            background-color: transparent;
            color: var(--gold);
        }

        /* Media Queries for Mobile Responsiveness */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Can be integrated into a mobile burger menu later */
            }
            
            .hero-content h1 {
                font-size: 2.8rem;
            }
            
            .hero-content p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Premium Sticky Header Layout -->
    <header>
        <nav class="nav-container">
            <a href="#home" class="logo">Travel Namaste</a>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">Our Story</a></li>
                <li><a href="#curated-tours">Curated Journeys</a></li>
                <li><a href="#contact" class="nav-cta">Inquire Now</a></li>
            </ul>
        </nav>
    </header>

    <!-- Structural Section Wrappers for Single-Page Application Experience -->
    <main>
        <section id="home">
            <div class="hero-slider">
                <!-- Pre-configured slides with automatic fade transition capabilities -->
                <div class="hero-slide slide-1 active"></div>
                <div class="hero-slide slide-2"></div>
            </div>
            
            <div class="hero-content">
                <h1>Elevated Journeys Through Nepal</h1>
                <p>Bespoke luxury itineraries, luxury expeditions, and deeply authentic cultural experiences.</p>
                <a href="#curated-tours" class="hero-btn">Explore Experiences</a>
            </div>
        </section>
    </main>

    <!-- Basic Slider JavaScript Component -->
    <script>
        const slides = document.querySelectorAll('.hero-slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Smooth background rotation every 5 seconds
        setInterval(nextSlide, 5000);
    </script>

</body>
</html>
